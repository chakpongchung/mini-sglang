# Manual-dispatch GPU test workflow.
#
# Targets a self-hosted runner deployed in a local k3s cluster with the labels
# [self-hosted, linux, gpu]. The runner pod must satisfy these prerequisites:
#
#   - Linux x86_64 or aarch64 (mini-sglang is Linux-only).
#   - NVIDIA device plugin installed on the k3s node, and the pod requests
#     `nvidia.com/gpu: 2` (or has `runtimeClassName: nvidia` with
#     `NVIDIA_VISIBLE_DEVICES=all`).
#   - At least 2 GPUs visible inside the pod — tests/kernel/test_tensor.py
#     hard-codes device="cuda:1", so a single-GPU pod will fail kernel tests.
#   - CUDA toolkit reachable (sgl_kernel / flashinfer JIT-compile at import).
#   - python3.10+ (default 3.12), plus git and curl available.
#   - uv may be preinstalled; if not, this workflow installs it inline.
#
# Trigger from the GitHub Actions UI: Actions → "GPU Tests" → Run workflow.

name: GPU Tests

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version used to create the venv"
        default: "3.12"
        type: string
      pytest-args:
        description: "Extra args passed to pytest (e.g. -k pattern, -x)"
        default: ""
        type: string
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"

jobs:
  pytest:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60
    env:
      UV_LINK_MODE: copy
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Show GPU and toolchain
        run: |
          nvidia-smi
          python3 --version
          uname -a

      - name: Install uv if missing
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Create venv and install package
        env:
          PY_VERSION: ${{ inputs.python-version || '3.12' }}
        run: |
          uv venv --python=python${PY_VERSION} .venv
          . .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run pytest
        env:
          PYTEST_EXTRA: ${{ inputs.pytest-args || '' }}
        run: |
          . .venv/bin/activate
          pytest tests/ -v ${PYTEST_EXTRA}
