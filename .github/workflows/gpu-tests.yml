# GPU test workflow.
#
# Targets the "mini-sglang-gpu" runner scale set provisioned by Actions Runner
# Controller (ARC) on the local k3s cluster. See deploy/arc/ for the Helm
# values, the CUDA-enabled runner Dockerfile, and the setup runbook.
#
# Runtime expectations on the runner pod (enforced by deploy/arc/values.yaml +
# runner.Dockerfile):
#   - Linux x86_64 or aarch64 (mini-sglang is Linux-only).
#   - >=2 GPUs visible — tests/kernel/test_tensor.py hard-codes device="cuda:1".
#   - CUDA toolkit reachable (sgl_kernel / flashinfer JIT-compile at import).
#   - python3.10+ (default 3.12), uv, git, curl preinstalled.
#
# Triggers:
#   - pull_request to main (auto-fires on PR open/update; skips docs).
#   - workflow_dispatch (manual, with optional python-version / pytest-args).

name: GPU Tests

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version used to create the venv"
        default: "3.12"
        type: string
      pytest-args:
        description: "Extra args passed to pytest (e.g. -k pattern, -x)"
        default: ""
        type: string
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"

jobs:
  pytest:
    # ARC scale-set name (see deploy/arc/values.yaml). Renaming the Helm
    # release means updating this value too.
    runs-on: mini-sglang-gpu
    timeout-minutes: 60
    env:
      UV_LINK_MODE: copy
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Show GPU and toolchain
        run: |
          nvidia-smi
          python3 --version
          uv --version
          uname -a

      - name: Create venv and install package
        env:
          PY_VERSION: ${{ inputs.python-version || '3.12' }}
        run: |
          uv venv --python=python${PY_VERSION} .venv
          . .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run pytest
        env:
          PYTEST_EXTRA: ${{ inputs.pytest-args || '' }}
        run: |
          . .venv/bin/activate
          pytest tests/ -v ${PYTEST_EXTRA}
